<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title description">
  <title id="title">Aperçu de Media Downloader</title>
  <desc id="description">Interface sombre de l’application Media Downloader avec champ de lien, plateformes prises en charge et options de téléchargement.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17251f"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8c547"/>
      <stop offset="1" stop-color="#f3df91"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect width="1200" height="750" fill="url(#background)"/>
  <circle cx="1010" cy="90" r="230" fill="#e8c547" opacity=".055"/>
  <circle cx="140" cy="700" r="240" fill="#64b77b" opacity=".06"/>
  <g opacity=".18" stroke="#fff" stroke-width="1">
    <path d="M0 130H1200M0 620H1200"/>
    <path d="M80 0V750M1120 0V750"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="205" y="72" width="790" height="606" rx="28" fill="#151716" stroke="#343a35" stroke-width="2"/>
    <circle cx="247" cy="117" r="8" fill="#e8c547"/>
    <text x="270" y="125" fill="#f5f0e8" font-family="Arial, sans-serif" font-size="19" font-weight="700">MEDIA DOWNLOADER</text>
    <text x="914" y="124" text-anchor="end" fill="#9caa9f" font-family="Arial, sans-serif" font-size="14">WEB APP</text>
    <path d="M236 151H964" stroke="#343a35"/>

    <text x="600" y="225" text-anchor="middle" fill="#f5f0e8" font-family="Arial, sans-serif" font-size="46" font-weight="700">Vos médias, simplement.</text>
    <text x="600" y="264" text-anchor="middle" fill="#a7afa9" font-family="Arial, sans-serif" font-size="19">Collez un lien pour analyser et récupérer votre média.</text>

    <rect x="276" y="314" width="648" height="74" rx="14" fill="#202420" stroke="#454c45" stroke-width="2"/>
    <circle cx="312" cy="351" r="11" fill="none" stroke="#a7afa9" stroke-width="2"/>
    <path d="m320 359 9 9" stroke="#a7afa9" stroke-width="2" stroke-linecap="round"/>
    <text x="350" y="358" fill="#929b93" font-family="Arial, sans-serif" font-size="17">Colle un lien YouTube, TikTok, Instagram…</text>
    <rect x="781" y="325" width="128" height="52" rx="10" fill="url(#accent)"/>
    <text x="845" y="358" text-anchor="middle" fill="#171710" font-family="Arial, sans-serif" font-size="16" font-weight="700">Analyser</text>

    <text x="286" y="438" fill="#c6ccc6" font-family="Arial, sans-serif" font-size="15" font-weight="700">PLATEFORMES PRISES EN CHARGE</text>
    <g font-family="Arial, sans-serif" font-size="15" fill="#d5dbd5">
      <rect x="286" y="458" width="112" height="38" rx="19" fill="#202420" stroke="#343a35"/><text x="342" y="483" text-anchor="middle">YouTube</text>
      <rect x="410" y="458" width="102" height="38" rx="19" fill="#202420" stroke="#343a35"/><text x="461" y="483" text-anchor="middle">TikTok</text>
      <rect x="524" y="458" width="112" height="38" rx="19" fill="#202420" stroke="#343a35"/><text x="580" y="483" text-anchor="middle">Instagram</text>
      <rect x="648" y="458" width="70" height="38" rx="19" fill="#202420" stroke="#343a35"/><text x="683" y="483" text-anchor="middle">X</text>
      <rect x="730" y="458" width="146" height="38" rx="19" fill="#202420" stroke="#343a35"/><text x="803" y="483" text-anchor="middle">+ autres plateformes</text>
    </g>

    <path d="M276 531H924" stroke="#343a35"/>
    <g font-family="Arial, sans-serif">
      <circle cx="305" cy="578" r="17" fill="#28372d"/><path d="m297 578 6 6 11-13" fill="none" stroke="#9fd4a7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="334" y="574" fill="#f0f2ed" font-size="16" font-weight="700">Formats et qualité au choix</text>
      <text x="334" y="598" fill="#9da69e" font-size="14">Vidéo, audio ou média direct</text>
      <circle cx="643" cy="578" r="17" fill="#28372d"/><path d="m635 578 6 6 11-13" fill="none" stroke="#9fd4a7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="672" y="574" fill="#f0f2ed" font-size="16" font-weight="700">Progression en direct</text>
      <text x="672" y="598" fill="#9da69e" font-size="14">Comptes et suivi des téléchargements</text>
    </g>
  </g>
  <text x="600" y="721" text-anchor="middle" fill="#8d978e" font-family="Arial, sans-serif" font-size="14" letter-spacing="3">NODE.JS · POSTGRESQL · YT-DLP</text>
</svg>
